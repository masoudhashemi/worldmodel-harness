# Shared model settings for the planned Stirrup runtime adapter.
# Credentials must be loaded separately; never serialize them into run metadata.
[model]
client = "litellm"
name = "openrouter/qwen/qwen3.8-27b"
api_base = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# Resolve relative to the repository root, not the process working directory.
dotenv_path = ".env"
# Initial experimental limits, not a claim about the provider's maximum context.
max_tokens = 12000
context_window_tokens = 32768
temperature = 0.0
timeout_seconds = 45.0
